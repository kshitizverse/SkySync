<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared File - SkySync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <style>
    body { background: #07141f; color: #f4f8fb; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 24px; }
    .share-card { background: rgba(11,27,39,0.92); border: 1px solid rgba(152,203,255,0.12); border-radius: 20px; padding: 40px; max-width: 480px; width: 100%; text-align: center; }
    .share-card .brand { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .share-card .brand i { color: #34d399; margin-right: 8px; }
    .share-card .subtitle { color: rgba(244,248,251,0.6); margin-bottom: 32px; }
    .file-info { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: left; }
    .file-info .file-name { font-size: 18px; font-weight: 600; word-break: break-all; margin-bottom: 8px; }
    .file-info .file-meta { color: rgba(244,248,251,0.5); font-size: 14px; }
    .share-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .share-actions a, .share-actions button { padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; transition: all 0.2s; }
    .download-btn { background: #34d399; color: #06111a; }
    .download-btn:hover { background: #2cc08a; }
    .preview-btn { background: rgba(255,255,255,0.08); color: #f4f8fb; border: 1px solid rgba(152,203,255,0.15) !important; }
    .preview-btn:hover { background: rgba(255,255,255,0.12); }
    .expired-msg { color: #f87171; font-size: 14px; margin-top: 16px; }
    .no-download { color: rgba(244,248,251,0.4); font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="share-card">
    <div class="brand"><i class="fas fa-cloud"></i> SkySync</div>
    <div class="subtitle">Shared file</div>

    {% if error %}
      <div class="expired-msg">{{ error }}</div>
    {% elif file %}
      <div class="file-info">
        <div class="file-name">{{ file.name }}</div>
        <div class="file-meta">{{ file.type }} &middot; {{ file.size }}</div>
      </div>

      <div class="share-actions">
        {% if can_download %}
          <a href="{{ download_url }}" class="download-btn" download>Download</a>
        {% endif %}
        {% if file.is_previewable %}
          <a href="{{ preview_url }}" class="preview-btn" target="_blank">Preview</a>
        {% endif %}
      </div>

      {% if not can_download %}
        <div class="no-download">Download is not enabled for this share.</div>
      {% endif %}
    {% endif %}
  </div>
</body>
</html>
